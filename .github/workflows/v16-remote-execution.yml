name: v1.6 remote execution

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-real-sshd:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Install Linux SSH and sandbox capabilities
        run: |
          sudo apt-get update && sudo apt-get install -y openssh-server bubblewrap
          sudo mkdir -p /run/sshd
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - run: node --import tsx --test --test-concurrency=1 tests/ssh-portable-workspace.test.ts

  macos-to-linux:
    name: ${{ matrix.name }} to Linux VM
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Install Lima and QEMU on macOS
        run: brew install lima qemu
      - name: Start Linux SSH target
        run: |
          limactl start --plain --name=default --vm-type=qemu --cpus=2 --memory=2 template://ubuntu-lts
          mkdir -p -m 0700 ~/.ssh
          printf 'Include ~/.lima/*/ssh.config\n' > ~/.ssh/config
          chmod 0600 ~/.ssh/config
          ssh lima-default 'sudo apt-get update && sudo apt-get install -y bubblewrap curl ca-certificates && sudo sysctl -w kernel.unprivileged_userns_clone=1 && (sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1 && sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true) && curl -fsSL https://deb.nodesource.com/setup_22.x -o /tmp/nodesource.sh && sudo bash /tmp/nodesource.sh && rm /tmp/nodesource.sh && sudo apt-get install -y nodejs'
      - name: Submit from native macOS and execute on Linux
        run: npx tsx scripts/validate_x_external_ssh.ts

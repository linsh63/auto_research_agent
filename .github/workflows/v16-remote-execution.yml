name: v1.6 remote execution

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v16-remote-execution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-real-sshd:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - name: Install Linux SSH and sandbox capabilities
        run: |
          sudo apt-get update && sudo apt-get install -y openssh-server bubblewrap
          sudo mkdir -p /run/sshd
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - run: node --import tsx --test --test-concurrency=1 tests/ssh-portable-workspace.test.ts

  macos-client-contract:
    name: ${{ matrix.name }} portable client
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
          - name: macOS x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Native OpenSSH and portable workspace contract
        run: node --import tsx --test --test-concurrency=1 tests/ssh-portable.test.ts tests/ssh-portable-workspace.test.ts
